name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Plots needs a headless display driver on the runner.
env:
  GKSwstype: "100"

jobs:
  julia:
    name: Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: Julia
      - uses: julia-actions/julia-runtest@v1
        with:
          project: Julia

  python:
    name: Python twin suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package and test dependencies
        run: python -m pip install ./Python[dev]
      - name: Run the twin test suite
        run: python -m pytest Python/tests -q
