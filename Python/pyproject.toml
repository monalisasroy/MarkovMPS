[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markovmps"
version = "1.0.0"
description = "Tensor-train propagators for classical Markov generators: first-passage statistics and Manna sandpile avalanches, cross-checked against an exact engine and kinetic Monte Carlo"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Monalisa Singh Roy" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
